<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangCards</title>

    <!-- Favicons -->
   <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        headerDark: '#1f2d25',
                        headerLight: '#3a4f41',
                        bgDark: '#121116',
                        bgLight: '#f3f4f6',
                        drawerGreen: '#8fa07e',
                        cardBg: '#e2decb',
                        cardBgBack: '#b0be9f',
                        btnGreen: '#8fa07e'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ملف التنسيقات -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- ===================== Header ===================== -->
    <header class="bg-[#24352b] text-white shadow-md relative z-20">
        
        <!-- الصف الأول: المنيو (يسار) + اللوجو (يمين) -->
        <div class="px-3 sm:px-4 py-3 flex items-center justify-between">
            <button id="open-drawer-btn" class="p-2 rounded-lg hover:bg-white/10 transition text-xl shrink-0" title="Open Menu" aria-label="Open Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

          <img src="android-chrome-192x192.png" alt="لوجو LangCards">
            <span>LangCards</span>
        </div>

        <!-- الصف الثاني: اختيار الليست + الأدوات (في المنتصف) -->
        <!-- تم استخدام justify-center لجعل المحتوى في المنتصف -->
        <div class="px-3 sm:px-4 pb-3 flex flex-wrap items-center justify-center gap-2 sm:gap-3 border-t border-white/10 pt-3">
            
            <!-- زر اختيار الليست -->
            <div class="relative shrink-0">
                <button id="list-dropdown-btn" class="flex items-center justify-between gap-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-sm sm:text-base font-medium min-w-[140px] max-w-[200px]" title="Select List">
                    <span id="current-list-title" class="truncate">No List Selected</span>
                    <i class="fa-solid fa-caret-down text-sm opacity-70 shrink-0"></i>
                </button>
                <div id="list-dropdown-menu" class="hidden absolute left-1/2 -translate-x-1/2 mt-2 w-56 rounded-xl shadow-2xl bg-white dark:bg-[#1a261f] border border-gray-200 dark:border-gray-700/50 z-50 overflow-hidden py-1">
                    <div id="list-dropdown-items" class="max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <!-- الأدوات (إضافة، تعديل، حذف) -->
            <div class="flex items-center gap-2 shrink-0">
                <button id="add-list-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-sm sm:text-base font-medium" title="Add List" aria-label="إضافة">
                    <i class="fa-solid fa-plus text-base"></i>
                    <span>New List</span>
                </button>

                <button id="edit-list-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-sm sm:text-base font-medium" title="Edit List Name">
                    <i class="fa-solid fa-pen text-base"></i>
                    <span>Edit</span>
                </button>

                <button id="delete-list-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-200 active:scale-95 transition-all text-sm sm:text-base font-medium" title="Delete Current List">
                    <i class="fa-regular fa-trash-can text-base"></i>
                    <span>Delete</span>
                </button>
            </div>

        </div>
    </header>

    <!-- ===================== Drawer Overlay ===================== -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300 opacity-0"></div>

    <!-- ===================== Sidebar Drawer ===================== -->
    <aside id="drawer" class="fixed top-0 left-0 h-full w-80 max-w-[85vw] bg-white dark:bg-[#18161f] text-gray-800 dark:text-gray-200 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
        <div class="bg-drawerGreen p-6 text-white text-3xl font-bold tracking-wide flex justify-between items-center">
            <span>LangCards</span>
            <button id="close-drawer-btn" class="text-xl hover:opacity-80" aria-label="Close Menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-6 flex-1">
            <div class="flex items-center gap-3 text-lg font-semibold text-gray-800 dark:text-gray-200 mb-6">
                <i class="fa-solid fa-palette text-drawerGreen"></i>
                <span>Theme</span>
            </div>

            <div class="space-y-4 pl-2">
                <label class="flex items-center justify-between cursor-pointer p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 transition">
                    <div class="flex items-center gap-4">
                        <input type="radio" name="theme-option" value="system" class="w-5 h-5 accent-drawerGreen cursor-pointer">
                        <span class="text-base font-medium">Follow System</span>
                    </div>
                    <i class="fa-solid fa-gear text-gray-400"></i>
                </label>

                <label class="flex items-center justify-between cursor-pointer p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 transition">
                    <div class="flex items-center gap-4">
                        <input type="radio" name="theme-option" value="light" class="w-5 h-5 accent-drawerGreen cursor-pointer">
                        <span class="text-base font-medium">Light</span>
                    </div>
                    <i class="fa-regular fa-sun text-gray-400"></i>
                </label>

                <label class="flex items-center justify-between cursor-pointer p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 transition">
                    <div class="flex items-center gap-4">
                        <input type="radio" name="theme-option" value="dark" class="w-5 h-5 accent-drawerGreen cursor-pointer">
                        <span class="text-base font-medium">Dark</span>
                    </div>
                    <i class="fa-regular fa-moon text-gray-400"></i>
                </label>
            </div>
        </div>
    </aside>

    <!-- ===================== Main ===================== -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto pb-32">
        <!-- ===== الكروت ===== -->
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards rendered dynamically -->
        </div>

        <!-- ===== Empty State ===== -->
        <div id="empty-state" class="hidden text-center py-20 text-gray-500 dark:text-gray-400"></div>
    </main>

    <!-- ===================== FAB ===================== -->
    <button id="add-card-fab" class="fixed bottom-8 right-6 w-14 h-14 bg-btnGreen hover:bg-[#7b8d69] text-white rounded-2xl shadow-2xl flex items-center justify-center text-2xl transition-transform active:scale-95 z-30" aria-label="Add Card">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- ===================== Toast ===================== -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 px-5 py-2.5 rounded-xl text-sm font-medium shadow-2xl opacity-0 transition-opacity pointer-events-none z-50">
        Text copied to clipboard!
    </div>

    <!-- ===================== Modal: Add/Edit Flashcard ===================== -->
    <div id="card-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-[#201d28] text-gray-900 dark:text-gray-100 rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-200 dark:border-gray-700/50">
            <h3 id="card-modal-title" class="text-xl font-semibold mb-4">Add Flashcard</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 dark:text-gray-400 mb-1 font-medium">Front Text (Word)</label>
                    <textarea id="card-front-input" rows="3" class="w-full bg-gray-50 dark:bg-[#14121a] text-gray-900 dark:text-white p-3 rounded-xl border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-btnGreen resize-none" placeholder="Enter word or sentence..."></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 dark:text-gray-400 mb-1 font-medium">Back Text (Translation/Info)</label>
                    <textarea id="card-back-input" rows="3" class="w-full bg-gray-50 dark:bg-[#14121a] text-gray-900 dark:text-white p-3 rounded-xl border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-btnGreen resize-none" placeholder="Enter translation or meaning..."></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="close-card-modal" class="px-5 py-2 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition font-medium">Cancel</button>
                <button id="save-card-btn" class="px-5 py-2 bg-btnGreen text-white rounded-xl hover:bg-[#7b8d69] transition font-medium">Add</button>
            </div>
        </div>
    </div>

    <!-- ===================== Modal: Add/Edit List ===================== -->
    <div id="list-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-[#201d28] text-gray-900 dark:text-gray-100 rounded-2xl w-full max-w-xs p-6 shadow-2xl border border-gray-200 dark:border-gray-700/50">
            <h3 id="list-modal-title" class="text-xl font-semibold mb-4">Add New List</h3>
            <div>
                <label class="block text-sm text-gray-600 dark:text-gray-400 mb-1 font-medium">List Name</label>
                <input type="text" id="list-name-input" class="w-full bg-gray-50 dark:bg-[#14121a] text-gray-900 dark:text-white p-3 rounded-xl border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-btnGreen" placeholder="List name...">
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="close-list-modal" class="px-5 py-2 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition font-medium">Cancel</button>
                <button id="save-list-btn" class="px-5 py-2 bg-btnGreen text-white rounded-xl hover:bg-[#7b8d69] transition font-medium">Add</button>
            </div>
        </div>
    </div>

    <!-- ===================== Modal: Confirm ===================== -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[60] hidden">
        <div class="bg-white dark:bg-[#201d28] text-gray-900 dark:text-gray-100 rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-200 dark:border-gray-700/50 transform transition-all scale-95 opacity-0" id="confirm-modal-content">
            <div class="flex items-center gap-3 mb-4 text-red-500">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                <h3 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Confirm Deletion</h3>
            </div>
            <p id="confirm-message" class="text-gray-600 dark:text-gray-300 mb-6">Are you sure you want to delete this item?</p>
            <div class="flex justify-end gap-3">
                <button id="cancel-confirm-btn" class="px-5 py-2 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition font-medium rounded-xl hover:bg-gray-100 dark:hover:bg-white/5">Cancel</button>
                <button id="ok-confirm-btn" class="px-5 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition font-medium shadow-lg">Delete</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-sm text-gray-500 dark:text-gray-400">
        © 2026 LangCards. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
